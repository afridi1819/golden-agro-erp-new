# Replace yourdomain.com with your real domain before first deploy.
# Step 1: run with the HTTP-only server block below to get a cert (see DEPLOYMENT.md).
# Step 2: uncomment the HTTPS server block and the redirect once the cert exists.

server {
    listen 80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Comment this out during first-run certbot issuance, uncomment after ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- Use these locations only until you have a cert; remove/comment once HTTPS is live ---
    location /auth-api/ {
        proxy_pass http://auth-service:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://business-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

