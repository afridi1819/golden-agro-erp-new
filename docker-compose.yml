services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth-service:
    build: ./AuthService
    restart: unless-stopped
    environment:
      ConnectionStrings__AuthConnection: "Server=mysql;Database=${MYSQL_AUTH_DB};User=root;Password=${MYSQL_ROOT_PASSWORD};"
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: 60
      Jwt__RefreshTokenExpiryDays: "7"
      Cors__AllowedOrigins: ${FRONTEND_ORIGIN}
      SpringBootApi__BaseUrl: "http://business-api:8080/api"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  business-api:
    build: ./business-api
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_BUSINESS_DB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}
      DDL_AUTO: ${DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  frontend:
    build:
      context: ./golden-agro-frontend
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL}
        VITE_BUSINESS_API_URL: ${VITE_BUSINESS_API_URL}
    restart: unless-stopped
    networks: [backend]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - auth-service
      - business-api
    networks: [backend]

networks:
  backend:

volumes:
  mysql-data:
